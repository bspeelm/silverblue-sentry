name = "release-rebase"
description = "Rebase Silverblue to a new Fedora release with the NVIDIA kmod ritual"
# DRAFT: not yet run end to end. Sentry refuses to start a draft. Read every step, then delete
# the `draft` line. Notes:
#   - rpm-ostree rebase has no dry run; `rpm-ostree cleanup -p` undoes a staged rebase.
#   - Today's deployment is pinned first, so a current Fedora N stays in the boot menu even
#     after the two new deployments this creates; `rollback` (from abandon) boots it again.
#   - Needs the rpmfusion-migrate workflow first (release packages tracked from the repo).
draft = true

[vars]
target = { prompt = "Target Fedora version", default = "{{ current_version + 1 }}" }

[[steps]]
id = "preflight"
title = "Pre-flight checks"
run = "sentry check preflight --target {{ target }}"
gate = "auto"
on_fail = "stop"

[[steps]]
id = "repos-ready"
title = "Every enabled third-party repo has Fedora {{ target }} metadata"
run = "sentry check repos-ready --target {{ target }}"
gate = "auto"
on_fail = "stop"

[[steps]]
id = "rpmfusion-tracked"
title = "RPM Fusion release packages tracked from the repo (rpmfusion-migrate done)"
run = "sentry check rpmfusion-pinned --expect unpinned"
gate = "auto"
on_fail = "stop"

[[steps]]
id = "target-ref"
title = "Target ref fedora/{{ target }}/x86_64/silverblue exists"
run = "ostree remote refs fedora | grep -x 'fedora:fedora/{{ target }}/x86_64/silverblue'"
gate = "auto"
on_fail = "stop"

[[steps]]
id = "kmod-guard"
title = "Exactly one layered kmod-nvidia package present"
run = "sentry check kmod-local --exactly-one"
gate = "auto"
on_fail = "stop"

[[steps]]
id = "snapshot"
title = "Record pre-upgrade state"
run = "sentry job audit --tag pre-rebase-{{ target }}"
gate = "auto"

[[steps]]
id = "pin-current"
title = "Pin today's {{ booted_version }} so it stays in the boot menu"
run = "sudo ostree admin pin booted && echo 'pinned {{ booted_version }}'"
gate = "confirm"

[[steps]]
id = "pin-verify"
title = "Booted deployment is pinned"
run = "sentry check booted-pinned"
gate = "auto"
on_fail = "stop"

[[steps]]
id = "rebase"
title = "Rebase to Fedora {{ target }}, dropping {{ old_kmod }}"
run = "rpm-ostree rebase fedora:fedora/{{ target }}/x86_64/silverblue --uninstall {{ old_kmod }}"
gate = "confirm"
timeout = "60m"
on_fail = "manual"
manual = """
A wall of `openssl-devel` / `kernel-devel` depsolve errors usually means your mirror lags
behind the new base. Wait a few hours, or add a repo pointing at the master mirror and retry:
  /etc/yum.repos.d/updates-master.repo:
    [updates-master]
    name=Fedora $releasever - $basearch - Updates (master mirror)
    baseurl=https://dl.fedoraproject.org/pub/fedora/linux/updates/$releasever/Everything/$basearch/
    enabled=1
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-fedora-$releasever-$basearch
A missing package from a third-party repo means it has no Fedora {{ target }} build yet.
Nothing is staged when the rebase fails, so retrying is safe."""

[[steps]]
id = "reboot-1"
title = "Reboot into Fedora {{ target }}"
kind = "reboot"

[[steps]]
id = "verify-boot"
title = "Confirm booted into Fedora {{ target }}"
run = "sentry check booted-version --expect {{ target }}"
gate = "auto"
on_fail = "stop"

[[steps]]
id = "akmods-key"
title = "The driver signing key is usable"
run = "sentry check akmods-key"
gate = "auto"
on_fail = "manual"
manual = """
The NVIDIA driver gets a security stamp (a signature) when it is built. Secure Boot only
loads stamped drivers. Right now the driver builder can't reach its stamp, so it would
build a driver your computer then refuses: a black or low-resolution screen after the restart.

To fix it, run this in a terminal and type your password when asked:
    sudo chgrp -R akmods /etc/pki/akmods/certs /etc/pki/akmods/private
Then press r here to check again. If it still fails, press f to fix it with Claude."""

[[steps]]
id = "akmods"
title = "Build the NVIDIA driver for the running kernel (skipped if a signed one is built)"
# An unsigned RPM left by an earlier build is removed and built again (akmods-key fixed it).
run = "sentry check akmods-built --exactly-one --signed || { sudo rm -f /var/cache/akmods/nvidia/kmod-nvidia-$(uname -r)-*.rpm; sudo akmods --force --kernels $(uname -r); }"
gate = "confirm"
timeout = "30m"

[[steps]]
id = "kmod-built"
title = "Exactly one built driver for the running kernel, and it is signed"
run = "sentry check akmods-built --exactly-one --signed"
gate = "auto"
on_fail = "manual"
manual = """
The driver build didn't leave exactly one signed driver file. Don't install anything yet:
an unsigned driver would be refused by Secure Boot after the restart.

- "is NOT signed": run `sentry check akmods-key` in a terminal. If it shows ✗, run
    sudo chgrp -R akmods /etc/pki/akmods/certs /etc/pki/akmods/private
  Then build again:
    sudo rm -f /var/cache/akmods/nvidia/kmod-nvidia-$(uname -r)-*.rpm
    sudo akmods --force --kernels $(uname -r)
  and press r here.
- "No akmod packages found" when building: the build tool isn't installed in this version
  of the system. Press f and Claude will walk you through it.
- Anything else: press f to fix it with Claude. The build log is in
  /var/cache/akmods/nvidia/ (the newest *.failed.log)."""

[[steps]]
id = "layer-kmod"
title = "Layer the new kmod-nvidia RPM"
run = "rpm-ostree install /var/cache/akmods/nvidia/kmod-nvidia-$(uname -r)-*.rpm"
gate = "confirm"

[[steps]]
id = "reboot-2"
title = "Reboot to load drivers"
kind = "reboot"

[[steps]]
id = "final-verify"
title = "Post-upgrade verification"
run = "sentry check nvidia-loaded && sentry check booted-version --expect {{ target }} && sentry check kargs && sentry check secureboot-mok"
gate = "auto"
on_fail = "manual"
manual = """
Something didn't come up right after the restart. The line with ✗ above says what.

"nvidia module not loaded" usually means the graphics driver was built without its
security stamp (signature), so Secure Boot refused it. To fix it:

 1. Check that this is the cause. In a terminal:
      journalctl -b -k | grep 'unsigned module'
    If it prints "Loading of unsigned module is rejected", carry on. If it prints nothing,
    stop here and press f to fix it with Claude.

 2. Let the driver builder use its stamp again:
      sentry check akmods-key
    If it shows ✗, run this and type your password:
      sudo chgrp -R akmods /etc/pki/akmods/certs /etc/pki/akmods/private

 3. Go back to the version of Fedora {{ target }} from just before the driver was added.
    Installing the driver removed the tool that builds it, and that earlier version still
    has it. Your files, apps and settings are not affected.
      rpm-ostree rollback
      systemctl reboot
    If rollback says there is nothing to roll back to, run this instead, then restart:
      rpm-ostree uninstall kmod-nvidia-$(uname -r)

 4. After the restart, open sentry and come back to this step. Build the driver again:
      sudo rm -f /var/cache/akmods/nvidia/kmod-nvidia-$(uname -r)-*.rpm
      sudo akmods --force --kernels $(uname -r)
      sentry check akmods-built --exactly-one --signed
    The last command must print a line starting with ✓. If it shows ✗, press f here.

 5. Install the new driver and restart:
      rpm-ostree install /var/cache/akmods/nvidia/kmod-nvidia-$(uname -r)-*.rpm
      systemctl reboot

 6. Open sentry again and press r to retry this step. Once it passes, the rest of the
    workflow carries on.

Any other ✗ line: press f to fix it with Claude."""

[[steps]]
id = "flatpak-idle"
title = "Make sure Steam is not running"
run = "sentry check flatpak-idle --app com.valvesoftware.Steam"
gate = "auto"
on_fail = "manual"
manual = """
Fully quit Steam (closing the window is not enough): `flatpak ps` must not list it.
A sandbox started before `flatpak update` keeps the old runtime."""

[[steps]]
id = "flatpak-gl"
title = "Flatpak GL.nvidia and GL32.nvidia match the host driver"
run = "flatpak update -y && sentry check flatpak-gl-nvidia"
gate = "confirm"
on_fail = "manual"
manual = """
GL.nvidia-<ver> and GL32.nvidia-<ver> must both match the host driver.
Run `flatpak update`, check `flatpak list --runtime | grep nvidia`, then fully quit and
relaunch Steam: a sandbox started before the update keeps the old runtime."""

[[steps]]
id = "toolbox-lists"
title = "Save each toolbox's user-installed package list"
run = '''mkdir -p "$SENTRY_WORKFLOW_RUN/toolboxes"; for c in $(podman ps -a --filter label=com.github.containers.toolbox=true --format '{{ "{{" }}.Names{{ "}}" }}'); do st=$(podman inspect -f '{{ "{{" }}.State.Status{{ "}}" }}' "$c"); [ "$st" = running ] || podman start "$c" >/dev/null; podman exec "$c" dnf -q repoquery --userinstalled > "$SENTRY_WORKFLOW_RUN/toolboxes/$c.txt"; echo "$c: $(wc -l < "$SENTRY_WORKFLOW_RUN/toolboxes/$c.txt") packages"; [ "$st" = running ] || podman stop -t 5 "$c" >/dev/null; done'''
gate = "auto"

[[steps]]
id = "toolbox-upgrade"
title = "Upgrade every toolbox to Fedora {{ target }} in place"
# As root through podman: no sudo, so no terminal needed. Lists saved by the previous step
# let you rebuild a toolbox from fedora-toolbox:{{ target }} if a distro-sync goes wrong.
run = '''for c in $(podman ps -a --filter label=com.github.containers.toolbox=true --format '{{ "{{" }}.Names{{ "}}" }}'); do echo "=== $c ==="; st=$(podman inspect -f '{{ "{{" }}.State.Status{{ "}}" }}' "$c"); [ "$st" = running ] || podman start "$c" >/dev/null; podman exec --user root "$c" dnf -y --releasever={{ target }} distro-sync; rc=$?; [ "$st" = running ] || podman stop -t 5 "$c" >/dev/null; [ $rc -eq 0 ] || exit $rc; done'''
gate = "confirm"
optional = true

[[steps]]
id = "post-snapshot"
title = "Record post-upgrade state and diff"
run = "sentry job audit --tag post-rebase-{{ target }} --diff-against pre-rebase-{{ target }}"
gate = "auto"

[[steps]]
id = "cleanup"
title = "Remove the intermediate deployment (optional)"
run = "rpm-ostree cleanup -r"
gate = "confirm"
optional = true

[[steps]]
id = "unpin-old"
title = "Unpin {{ booted_version }} once Fedora {{ target }} has proven itself (optional)"
run = '''i=$(ostree admin status | awk -v v='{{ booted_version }}' '{ for (k = 1; k <= NF; k++) if (length($k) > 60 && $k ~ /^[0-9a-f]+\.[0-9]+$/) { i++; break } } $1 == "Version:" && $2 == v { print i - 1; exit }'); [ -n "$i" ] || { echo "{{ booted_version }} is no longer deployed"; exit 0; }; sudo ostree admin pin --unpin "$i" && echo "unpinned {{ booted_version }} (deployment $i)"'''
gate = "confirm"
optional = true

[[steps]]
id = "rollback"
title = "Boot the pinned {{ booted_version }} again"
run = '''i=$(ostree admin status | awk -v v='{{ booted_version }}' '{ for (k = 1; k <= NF; k++) if (length($k) > 60 && $k ~ /^[0-9a-f]+\.[0-9]+$/) { i++; break } } $1 == "Version:" && $2 == v { print i - 1; exit }'); [ -n "$i" ] || { echo "{{ booted_version }} is not deployed any more; pick an entry in the boot menu (Esc at boot)"; exit 1; }; sudo ostree admin set-default "$i" && echo "next boot: {{ booted_version }} · reboot when ready"'''
gate = "confirm"
rollback = true
optional = true
