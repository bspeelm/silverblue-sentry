# sentry-server configuration: ~/.config/sentry/server_config.yaml
#
# Each entry under `servers:` is one machine sentry-server monitors over ssh. Nothing is
# installed on the server: sentry-server runs read-only commands through one multiplexed ssh
# connection while you have it open, and maintenance only after you confirm it.
#
# `sentry-server init <ssh-host>` drafts this file from what it finds on the server;
# `sentry-server lint` checks it. sentry-server never rewrites this file.

servers:
  myserver:
    # What ssh connects to: an alias from ~/.ssh/config, or user@host. Default: the name above.
    # Key-based login is required (sentry-server never types passwords for ssh).
    ssh: admin@myserver.example

    # Read-only commands sentry-server may run as `sudo -n` (never prompting). Each entry is
    # the start of a command: `docker ps` allows `docker ps -a`, not `docker rm`. Leave out
    # what you'd rather not grant; those panels then say what's missing. Write commands are
    # refused here: maintenance goes in `actions:` and always asks first.
    sudo:
      - docker ps
      - docker inspect
      - docker logs
      - docker compose ls
      - docker stats
      - smartctl
      - fail2ban-client status
      - journalctl
      - ss -tulpn

    # Filesystems to watch, percent used (defaults: warn 85, crit 95).
    disks:
      - mount: /
      - mount: /srv/data
        warn: 90
        crit: 97

    # SMART health. Disks that are asleep are left asleep and shown as such.
    smart: [/dev/sda, /dev/sdb]

    # Services that must be running.
    services: [app.service, docker.service, ssh.service]

    # Timers whose last run must be recent and successful.
    timers:
      - unit: backup.timer
        max_age: 26h

    # Docker compose projects (status, health, pull/up from the Containers tab).
    compose:
      - name: stack
        file: /home/admin/stack/compose.yaml

    containers:
      ignore: []            # container names (globs) that may be stopped
      restart_window: 24h   # started more recently than this counts as a restart

    # Expected listening sockets, `addr:port/process`; `*` matches anything.
    listeners:
      - "*:22/*"
      - "*:80/*"
      - "*:443/*"
      - "127.0.0.1:*/*"

    # Findings that are expected on this server (ids from the Audit tab; globs allowed).
    findings: []

    thresholds:
      mem: 90             # percent used
      load_per_core: 2.0  # 1-minute load divided by cores
      cpu_temp: 85        # °C
      gpu_temp: 83

    # Your own maintenance commands, run on the server after a confirm box.
    actions:
      - id: app-reload
        title: Reload the app's configuration
        run: systemctl reload app.service
        sudo: true
        undo: none needed

    # What's pinned or held on purpose, why, and when to look at it again: the Maintenance
    # tab and `sentry-server maint`. Newer versions are looked up from this machine (never
    # from the server), only when you ask. Nothing changes here: a change goes through the
    # item's workflow, one item at a time.
    maintenance:
      # Local files Claude may read when you ask it to assess a change (runbooks, notes).
      notes: [~/notes/myserver-runbook.md]
      items:
        - id: web
          image: {service: web}          # the pin is read from the compose file
          source: github:example/web     # or docker:repo, ghcr:owner/image
          tier: amber                    # green | amber | red: how careful a change must be
          hold: "1.5 migrates the database one way; wait for 1.5.2"
          review_by: 2027-01-15          # findings about it wait until then (z moves it)
          workflow: compose-bump         # p plans the change with it
        - id: engine
          apt: [engine-pkg, engine-cli]  # held packages: installed vs apt's candidate
          tier: red
          hold: "an engine update restarts every container"
          eol: docker-engine/29          # endoflife.date product/cycle
        - id: app
          version_cmd: /opt/app/bin/app --version
          unit: app.service
          source: github:example/app
        - id: legacy
          unit: legacy.service
          retire: {replaced_by: app.service, workflow: retire-service}
