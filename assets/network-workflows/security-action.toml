name = "security-action"
description = "What Enter on the Security screen does: one change on the router, shown first, taken back by itself if the router stops answering"
# Started by the Security screen (4), which fills in `action`: blocking or unblocking a
# device by MAC, closing or opening a port forward, ssh with keys only, the admin page on
# HTTPS, the blocklist's refresh or schedule, a station sent off the Wi-Fi. Both steps run
# on this machine (`sentry-network security …`), which carries them out over ssh:
#   show   reads only: the plan in words, the exact lines, the guard's own preview, and
#          what is proven first (a key login on a new connection, the admin page on HTTPS)
#   apply  proves again, then: a config change goes through the guard (the configs are
#          snapshotted and the router armed to restore them by itself BEFORE anything
#          changes; kept only if the router answers as before, twice, with the proofs still
#          holding); what isn't config is a single command, shown in the first step.
# Auto mode never answers the second step. A new Wi-Fi password is `guarded-change`.
# Built-in: network.

[vars.action]
prompt = "The action (the Security screen fills this in: Enter on a row there)"

[[steps]]
id = "show"
title = "What would change, and whether it can start (reads only)"
run = "sentry-network security plan {{ action }}"
gate = "auto"

[[steps]]
id = "apply"
title = "Do it: the router undoes it by itself if it stops answering"
run = "sentry-network security apply {{ action }}"
gate = "confirm"
risky = true
on_fail = "manual"
manual = """
It is not in place. The log (L) says which of these happened:
  STOPPED        nothing was changed (a proof failed, something else is staged, or the
                 revert couldn't be armed)
  FAILED         a line or a command failed; a config change was not kept
  REVERTED       it was applied but not confirmed, and the router took it back by itself
  NOT CONFIRMED  the router couldn't be asked afterwards; it restores itself at its deadline
Abandon (a) this run; Enter on the row on Security starts it again."""
