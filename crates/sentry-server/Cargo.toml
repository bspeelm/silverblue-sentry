[package]
name = "sentry-server"
description = "sentry for a server over ssh: monitor and maintain it, deliberately, as a target of the app"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
sentry-core.workspace = true
sentry-app.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
serde_ignored.workspace = true
jiff.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
rustix.workspace = true
signal-hook.workspace = true
serde-saphyr.workspace = true

[features]
# Test support for the window's own tests (`crates/sentry`).
testing = ["sentry-core/testing", "sentry-app/testing"]

[dev-dependencies]
sentry-core = { workspace = true, features = ["testing"] }
sentry-app = { workspace = true, features = ["testing"] }
insta.workspace = true
