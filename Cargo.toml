[package]
name = "sentry"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Daemon-free monitor & maintenance TUI for Fedora Silverblue"
license = "MIT"
publish = false

[dependencies]
ratatui = "0.30"
sysinfo = { version = "0.39", default-features = false, features = ["system", "component", "network", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
serde_ignored = "0.1"
jiff = { version = "0.2", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
signal-hook = "0.4"
rustix = { version = "1", features = ["process", "fs"] }

[dev-dependencies]
insta = "1.49"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
