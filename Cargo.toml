[workspace]
resolver = "3"
members = ["crates/sentry-core", "crates/sentry", "crates/sentry-server"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/bspeelm/silverblue-sentry"
homepage = "https://github.com/bspeelm/silverblue-sentry"
publish = false

[workspace.dependencies]
sentry-core = { path = "crates/sentry-core" }
ratatui = "0.30"
sysinfo = { version = "0.39", default-features = false, features = ["system", "component", "network", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
serde_ignored = "0.1"
jiff = { version = "0.2", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
signal-hook = "0.4"
rustix = { version = "1", features = ["process", "fs"] }
serde-saphyr = "1.3"
insta = "1.49"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
